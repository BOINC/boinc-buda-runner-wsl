name: Build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        if: success()
        run: |
          docker build . -t wsl-builder --platform ${{ matrix.platform }}
          docker run --rm -v ${{ github.workspace }}:/app wsl-builder /app/build.sh ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: boinc-buda-runner-${{ matrix.arch }}.wsl
          path: ./boinc-buda-runner-${{ matrix.arch }}.wsl
